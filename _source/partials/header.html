<header class="site-header" id="siteHeader" data-open="false">
  <div class="wrap header-inner">
    <a class="brand" href="[[home]]#home">
      <span class="emblem" role="img" aria-label="[[alt:logo]]"></span>
      <span class="brand-name">PubliMentor</span>
    </a>
    <div class="header-panel" id="siteMenu">
      <nav class="nav" aria-label="Primary">
        <a href="[[home]]#services" data-i18n="nav.services"></a>
        <a href="[[home]]#training" data-i18n="nav.training"></a>
        <a href="[[home]]#testimonials" data-i18n="nav.testimonials"></a>
        <a href="[[home]]#mission" data-i18n="mission.title"></a>
        <a href="[[home]]#about" data-i18n="nav.about"></a>
        <a href="[[newsletter]]" data-i18n="nav.newsletter" data-spy="newsletter"[[newsletter_current]]></a>
        <a href="[[home]]#contact" data-i18n="nav.contact"></a>
      </nav>
      <div class="header-actions">
        <a class="btn btn-tonal" href="[[url:app]]">[[ic:zap]]<span data-i18n="cta.launchapp"></span></a>
        <a class="btn btn-primary" href="[[home]]#contact" data-i18n="cta.getintouch"></a>
      </div>
      <div class="menu-palette">
        <span data-i18n="palette.label"></span>
        <div class="palette" role="group" aria-label="Colour palette" data-i18n-attr="aria-label:palette.label">
          <button type="button" data-palette="green" aria-pressed="true" aria-label="Green palette" data-i18n-attr="aria-label:palette.green"></button>
          <button type="button" data-palette="blue" aria-pressed="false" aria-label="Blue palette" data-i18n-attr="aria-label:palette.blue"></button>
        </div>
      </div>
    </div>
    <div class="lang" role="group" aria-label="Language / 语言">
      <button type="button" data-lang="en" aria-pressed="true">EN</button>
      <button type="button" data-lang="zh" aria-pressed="false" lang="zh-Hans">中文</button>
    </div>
    <div class="palette" role="group" aria-label="Colour palette" data-i18n-attr="aria-label:palette.label">
      <button type="button" data-palette="green" aria-pressed="true" aria-label="Green palette" data-i18n-attr="aria-label:palette.green"></button>
      <button type="button" data-palette="blue" aria-pressed="false" aria-label="Blue palette" data-i18n-attr="aria-label:palette.blue"></button>
    </div>
    <button class="menu-btn" type="button" id="menuBtn" aria-expanded="false" aria-controls="siteMenu" aria-label="Menu" data-i18n-attr="aria-label:ui.menu">
      [[ic:menu ic-open]][[ic:x ic-close]]
    </button>
  </div>
</header>
